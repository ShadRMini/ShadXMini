    <div id="initial-shell" aria-hidden="true">

        #initial-shell {

          font-size: 42px;
          font-weight: 900;
          letter-spacing: 2px;
          background: linear-gradient(135deg, #FDE68A 0%, #C8A45C 100%);

          background-clip: text;

        }
        #initial-shell .shell-subtitle {
          font-size: 14px;
          color: #9CA3AF;
          margin-bottom: 40px;
        }

          width: 32px;
          height: 32px;
          border: 3px solid rgba(200, 164, 92, 0.2);
          border-top-color: #C8A45C;
          border-radius: 50%;
          animation: shell-spin 0.8s linear infinite;
        }
        @keyframes shell-spin {
          to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
          #initial-shell .shell-spinner { animation: none; }
        }
