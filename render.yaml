services:
  - type: web
    name: shadxmini-api
    env: node
    plan: starter
    region: frankfurt # or oregon / ohio
    nodeVersion: "20.18.0"
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: ENABLE_TELEGRAM_WEBHOOKS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: TELEGRAM_STORE_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_STORE_WEBHOOK_SECRET
        sync: false
      - key: SAM_WEBHOOK_SECRET
        sync: false
      - key: SAM_API_KEY
        sync: false
      - key: SAM_API_BASE_URL
        value: "https://www.sam-api.pro/api"
      - key: SAM_SHAMCASH_IDENTIFIER
        sync: false
      - key: SHAMCASH_SYNC_ENABLED
        value: "true"
      - key: ORDERS_SYNC_ENABLED
        value: "true"
      - key: ORDERS_SYNC_INTERVAL_MINUTES
        value: "5"
      - key: ADMIN_SEED_USERNAME
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
